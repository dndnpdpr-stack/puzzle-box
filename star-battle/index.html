<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별 배치</title>
<link rel="stylesheet" href="../common.css">
<style>
  :root {
    --r0: hsl(0 75% 88%);   --r1: hsl(32 85% 85%);  --r2: hsl(54 80% 80%);
    --r3: hsl(100 50% 82%); --r4: hsl(165 45% 80%); --r5: hsl(195 65% 84%);
    --r6: hsl(228 70% 88%); --r7: hsl(268 55% 88%); --r8: hsl(318 55% 88%);
    --wall: #4b4f58;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --r0: hsl(0 35% 30%);   --r1: hsl(30 40% 28%);  --r2: hsl(54 35% 26%);
      --r3: hsl(100 25% 26%); --r4: hsl(165 30% 24%); --r5: hsl(195 40% 27%);
      --r6: hsl(228 35% 32%); --r7: hsl(268 30% 32%); --r8: hsl(318 30% 30%);
      --wall: #c9ced6;
    }
  }
  .board {
    display: grid; grid-template-columns: repeat(var(--n), var(--cs));
    justify-content: center; margin: 0 auto; touch-action: none; /* 판 위 끌기가 화면 스크롤·확대가 되지 않게 */
  }
  .cell {
    width: var(--cs); height: var(--cs); padding: 0; border-radius: 0;
    border: 0;
    font-size: calc(var(--cs) * 0.55); line-height: 1; color: var(--ink);
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  @media (hover: hover) { .board:not(.locked) .cell:hover { filter: brightness(0.94); } }
  .cell.x { color: var(--muted); font-size: calc(var(--cs) * 0.42); }
  .cell.bad { color: var(--bad); }
  .cell.flag { animation: flag 0.5s 3; }
  @keyframes flag { 50% { background: var(--bad); color: #fff; } }
  .board.locked .cell { cursor: default; }
</style>
</head>
<body>
<main>
  <a class="back" href="../">← 퍼즐 목록</a>
  <h1>별 배치</h1>
  <p class="sub">가로줄, 세로줄, 색깔 영역마다 ★을 하나씩 놓으세요. ★끼리는 대각선을 포함해 서로 붙을 수 없습니다.</p>

  <div class="controls">
    <span class="label">크기</span>
    <div class="seg" id="sizes"></div>
    <span class="spacer"></span>
    <button id="undo">되돌리기</button>
    <button id="clear">지우기</button>
    <button id="hint">힌트</button>
    <button id="giveup">정답 보기</button>
    <button class="primary" id="new">새 게임</button>
  </div>

  <div class="status">
    <span>별: <b id="count"></b></span>
    <span>시간: <b id="time">00:00</b></span>
    <span>힌트 사용: <b id="hints">0</b></span>
  </div>

  <div class="board" id="board"></div>
  <div class="msg" id="msg"></div>

  <div class="help">
    · 한 번 누르면 X(별이 없다는 표시), 두 번 빠르게 누르면 ★을 놓습니다. 다시 누르면 지워집니다.<br>
    · 빈칸에서 끌면 지나가는 칸에 X가 놓이고, X에서 끌면 지나가는 X가 지워집니다.<br>
    · 규칙에 어긋난 ★은 빨간색으로 표시됩니다.<br>
    · 힌트는 틀린 ★이 있으면 그 칸을 짚어주고, 없으면 정답 ★ 하나를 놓아줍니다.
  </div>
</main>

<script src="stars.js"></script>
<script>
const SIZES = [5, 6, 7, 8, 9];
const $ = (id) => document.getElementById(id);
let n = 6, regions, solution, marks, history, cells, hintCount, done, timer, start;

function tick() {
  const s = Math.floor((Date.now() - start) / 1000);
  $('time').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function showMsg(text, kind) {
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg' + (text ? ' show ' + kind : '');
}

function newGame() {
  ({ regions, solution } = Stars.generate(n));
  marks = Array.from({ length: n }, () => Array(n).fill(0));
  history = []; hintCount = 0; done = false; lastTap = null; stroke = null;
  $('hints').textContent = 0;
  showMsg('');
  build();
  render();
  clearInterval(timer);
  start = Date.now();
  timer = setInterval(tick, 1000);
  tick();
}

// 칸 크기를 화면 폭에 맞춘다(320px 폭 9×9도 들어가도록 최소 28px)
function sizeBoard() {
  const board = $('board');
  board.style.setProperty('--cs', '28px'); // 이전의 큰 판이 화면 폭을 늘려 놓은 채로 재지 않도록 먼저 줄인다
  const cs = Math.max(28, Math.min(56, Math.floor((Math.min(window.innerWidth, 720) - 32) / n)));
  board.style.setProperty('--cs', cs + 'px');
}

function build() {
  const board = $('board');
  sizeBoard();
  board.style.setProperty('--n', n);
  board.innerHTML = '';
  cells = [];
  const wall = '3px solid var(--wall)', thin = '1px solid color-mix(in srgb, var(--wall) 30%, transparent)';
  for (let r = 0; r < n; r++) {
    cells.push([]);
    for (let c = 0; c < n; c++) {
      const b = document.createElement('button');
      b.className = 'cell';
      b.style.background = `var(--r${regions[r][c]})`;
      // 칸마다 위·왼쪽 선만 그린다(영역이 바뀌면 굵게). 바깥 테두리는 아래·오른쪽도.
      b.style.borderTop = r === 0 || regions[r - 1][c] !== regions[r][c] ? wall : thin;
      b.style.borderLeft = c === 0 || regions[r][c - 1] !== regions[r][c] ? wall : thin;
      if (r === n - 1) b.style.borderBottom = wall;
      if (c === n - 1) b.style.borderRight = wall;
      b.dataset.r = r; b.dataset.c = c;
      // 마우스·터치는 아래 포인터 처리에서 다룬다. 키보드(Enter/Space)로 누른 경우만 여기서 받는다.
      b.onclick = (e) => { if (e.detail === 0) tap(r, c); };
      board.appendChild(b);
      cells[r].push(b);
    }
  }
}

function render() {
  const bad = Stars.conflicts(regions, marks);
  let stars = 0;
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++) {
      const v = marks[r][c], b = cells[r][c];
      if (v === 2) stars++;
      b.textContent = v === 2 ? '★' : v === 1 ? '×' : '';
      b.classList.toggle('x', v === 1);
      b.classList.toggle('bad', v === 2 && bad[r][c]);
    }
  $('count').textContent = `${stars} / ${n}`;
  $('board').classList.toggle('locked', done);
  for (const id of ['undo', 'clear', 'hint', 'giveup']) $(id).disabled = done;
  $('undo').disabled = done || !history.length;
}

// changes: [[r, c, 새 값], ...] 를 한 번의 되돌리기 단위로 적용
function apply(changes) {
  history.push(changes.map(([r, c]) => [r, c, marks[r][c]]));
  for (const [r, c, v] of changes) marks[r][c] = v;
  render();
  if (Stars.isSolved(regions, marks)) win();
}

// 한 번 누르기: 빈칸 ↔ X (★은 지움). 같은 칸을 빨리 두 번 누르기: ★ 놓기/지우기.
// 첫 누르기는 바로 반영하고, 두 번째 누르기가 오면 첫 누르기를 되돌린 뒤 ★을 토글한다(되돌리기 한 번 단위).
const DOUBLE_MS = 350;
let lastTap = null;
function tap(r, c) {
  if (done) return;
  const now = Date.now();
  if (lastTap && lastTap.r === r && lastTap.c === c && now - lastTap.t < DOUBLE_MS) {
    lastTap = null;
    for (const [a, b, v] of history.pop()) marks[a][b] = v;
    apply([[r, c, marks[r][c] === 2 ? 0 : 2]]);
    return;
  }
  lastTap = { r, c, t: now };
  apply([[r, c, marks[r][c] === 0 ? 1 : 0]]);
}

// 끌기: 빈칸에서 시작하면 지나가는 빈칸에 X, X에서 시작하면 지나가는 X를 지운다. ★은 건드리지 않는다.
let stroke = null;
function cellAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.classList.contains('cell') && $('board').contains(el) ? [+el.dataset.r, +el.dataset.c] : null;
}
function strokePaint([r, c]) {
  const key = r * n + c;
  if (stroke.seen.has(key)) return;
  stroke.seen.add(key);
  const from = stroke.mode === 'x' ? 0 : 1, to = 1 - from;
  if (marks[r][c] !== from) return;
  stroke.undo.push([r, c, from]);
  marks[r][c] = to;
}
$('board').addEventListener('pointerdown', (e) => {
  if (done || e.button !== 0) return;
  const cell = cellAt(e.clientX, e.clientY);
  if (!cell) return;
  e.preventDefault();
  const v = marks[cell[0]][cell[1]];
  stroke = { start: cell, mode: v === 0 ? 'x' : v === 1 ? 'erase' : null, moved: false, seen: new Set(), undo: [] };
});
document.addEventListener('pointermove', (e) => {
  if (!stroke) return;
  const cell = cellAt(e.clientX, e.clientY);
  if (!cell || (!stroke.moved && cell[0] === stroke.start[0] && cell[1] === stroke.start[1])) return;
  if (!stroke.mode) return; // ★에서 시작한 끌기는 아무것도 하지 않는다
  if (!stroke.moved) { stroke.moved = true; strokePaint(stroke.start); }
  strokePaint(cell);
  render();
});
function endStroke(e) {
  if (!stroke) return;
  const s = stroke;
  stroke = null;
  if (!s.moved) {
    if (e.type === 'pointerup') tap(s.start[0], s.start[1]);
    return;
  }
  lastTap = null;
  if (s.undo.length) history.push(s.undo);
  render();
  if (Stars.isSolved(regions, marks)) win();
}
document.addEventListener('pointerup', endStroke);
document.addEventListener('pointercancel', endStroke);

function win() {
  done = true;
  clearInterval(timer);
  tick();
  const h = hintCount ? ` (힌트 ${hintCount}회)` : '';
  showMsg(`🎉 완성! ${n}×${n} 별 배치를 ${$('time').textContent}만에 풀었습니다${h}.`, 'win');
  render();
}

$('undo').onclick = () => {
  lastTap = null;
  if (done || !history.length) return;
  for (const [r, c, v] of history.pop()) marks[r][c] = v;
  showMsg('');
  render();
};

$('clear').onclick = () => {
  lastTap = null;
  if (done) return;
  const changes = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (marks[r][c]) changes.push([r, c, 0]);
  if (changes.length) apply(changes);
  showMsg('');
};

$('hint').onclick = () => {
  lastTap = null;
  if (done) return;
  const wrong = [], missing = [];
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) if (marks[r][c] === 2 && solution[r] !== c) wrong.push([r, c]);
    if (marks[r][solution[r]] !== 2) missing.push(r);
  }
  hintCount++;
  $('hints').textContent = hintCount;
  if (wrong.length) {
    const [r, c] = wrong[Math.floor(Math.random() * wrong.length)];
    const b = cells[r][c];
    b.classList.remove('flag'); void b.offsetWidth; b.classList.add('flag');
    setTimeout(() => b.classList.remove('flag'), 1500);
    showMsg('이 별은 정답 자리가 아니에요', 'info');
  } else if (missing.length) {
    const r = missing[Math.floor(Math.random() * missing.length)];
    showMsg('');
    apply([[r, solution[r], 2]]);
  }
};

$('giveup').onclick = () => {
  if (done) return;
  done = true;
  clearInterval(timer);
  marks = marks.map((row, r) => row.map((_, c) => (solution[r] === c ? 2 : 0)));
  render();
  showMsg('정답입니다. "새 게임"을 눌러 다시 도전하세요.', 'info');
};

$('new').onclick = newGame;

SIZES.forEach((s) => {
  const b = document.createElement('button');
  b.textContent = `${s}×${s}`;
  b.dataset.v = s;
  b.onclick = () => { n = s; refreshSeg(); newGame(); };
  $('sizes').appendChild(b);
});
function refreshSeg() { for (const b of $('sizes').children) b.classList.toggle('on', +b.dataset.v === n); }
refreshSeg();
addEventListener('resize', sizeBoard); // 화면을 돌리거나 창 크기를 바꾸면 칸 크기를 다시 맞춘다
newGame();
</script>
</body>
</html>
